<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин музичної електроніки</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Web Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@aspect-ui/webawesome@1.0.13/dist/webawesome.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                MyElectronicShop
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Відкрити меню">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <form class="d-flex mx-auto search-form mb-2 mb-md-0" role="search">
                    <div class="input-group">
                        <input type="text" class="form-control" id="searchInput" placeholder="Пошук товарів...">
                        <button class="btn btn-outline-light" type="button" id="searchBtn" aria-label="Шукати">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
                
                <a href="cart.html" class="btn btn-outline-light position-relative mb-2 mb-md-0 rounded-pill" id="cartBtn">
                    <i class="bi bi-cart3"></i> Кошик
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row g-4 align-items-start">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <p class="text-warning fw-bold mb-1">Ваш кошик</p>
                                <h1 class="h3 mb-0">Товари у кошику</h1>
                            </div>
                            <a href="index.html" class="btn btn-outline-dark btn-sm">
                                <i class="bi bi-arrow-left"></i> До покупок
                            </a>
                        </div>

                        <div id="cartItems"></div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Підсумок</h2>
                        <p class="mb-2">Загальна сума: <strong id="totalPrice">0 грн</strong></p>
                        <p class="text-muted small mb-4">Після натискання “Оплатити” корзина очиститься, як і в симуляції.</p>

                        <div class="d-grid gap-2">
                            <button id="clearCartBtn" class="btn btn-outline-secondary">Очистити кошик</button>
                            <button id="payBtn" class="btn btn-warning">Оплатити</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <hr class="border-secondary">
            <div class="text-center text-white-50">
                <p class="mb-0">&copy; 2026 LogikaShop. Всі права захищені. Створено учнями Logika.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="cart.js"></script>
</body>
</html>
